<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="">
        <p>
            <label for="icor">Cor:</label>
            <input type="color" id="icor" name="cor" value="#FF0000">
        </p>
        <p>
            <label for="inivel">Satisfação:</label>
            <input type="range" id="irange" name="satisfacao" min="0" max="10" value="0">
        </p>
        <p>
            <label for="ifoto">Foto do perfil</label>
            <input type="file" id="ifoto" name="foto" accept="image/*">
        </p>
        <p>
            <input type="button" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
