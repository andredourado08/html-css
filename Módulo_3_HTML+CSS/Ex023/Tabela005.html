<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio de tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            width: 500px;
        }
        caption{
            font-size : 1.3em;
            font-weight: bold;
            padding: 8px;
        }
        th, td{
            border: 1px solid black;
            padding: 8px;
        }
        .cnome{
            background-color: lightcoral;
        }

        .csexo{
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <h1>Exercicio de tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprofissao">
        </colgroup>
        <caption>Minha tabela</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>Feminino</td>
            <td>25</td>
            <td>Engenheira</td>
        </tr>
        <tr>
            <td>Neymar</td>
            <td>Masculino</td>
            <td>25</td>
            <td>Footballer</td>
        </tr>
        <tr>
            <td>Duda</td>
            <td>Feminino</td>
            <td>50</td>
            <td>Professora</td>
        </tr>
        <tr>
            <td>Gabiela</td>
            <td>Feminino</td>
            <td>29</td>
            <td>Denista</td>
        </tr>
        <tr>
            <td>André</td>
            <td>Masculino</td>
            <td>28</td>
            <td>Desenvolvedor</td>
        </tr>
        <tr>
            <td>João</td>
            <td>Masculino</td>
            <td>30</td>
            <td>Professor</td>
        </tr>
    </table>
</body>
</html>
