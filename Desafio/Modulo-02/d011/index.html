<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astronauta no Espaço</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .space {
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 30% 40%, #0d3460 0%, transparent 60%),
        radial-gradient(ellipse at 70% 60%, #0a2040 0%, transparent 55%),
        radial-gradient(ellipse at 50% 20%, #162040 0%, transparent 50%),
        #050518;
      position: relative;
      overflow: hidden;
    }

    .stars {
      position: absolute;
      inset: 0;
    }

    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.2; }
      to   { opacity: 1; }
    }

    .astronaut {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      transform: translate(-50%, -50%);
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 0 24px rgba(100, 180, 255, 0.45));
    }

    @keyframes float {
      0%, 100% {
        transform: translate(-50%, -50%) rotate(-5deg);
      }
      50% {
        transform: translate(-50%, calc(-50% - 24px)) rotate(5deg);
      }
    }
  </style>
</head>
<body>
  <div class="space">
    <div class="stars" id="stars"></div>
    <!-- Troque o src pela sua imagem PNG com fundo transparente -->
    <img class="astronaut" src="astronauta.png" alt="Astronauta">
  </div>

  <script>
    const container = document.getElementById('stars');
    for (let i = 0; i < 150; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      star.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        top: ${Math.random() * 100}%;
        left: ${Math.random() * 100}%;
        animation-delay: ${Math.random() * 2}s;
        animation-duration: ${1.5 + Math.random() * 2}s;
      `;
      container.appendChild(star);
    }
  </script>
</body>
</html>
