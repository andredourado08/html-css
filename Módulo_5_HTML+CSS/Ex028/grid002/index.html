<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout 002</title>
    <style>
        *{
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: lightyellow;
        }

        h1{
            text-align: center;
        }

        div.container{
            background-color: white;
            border: 2px solid black;
            padding: 10px;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        div.card{
            background-color: lightgreen;
            border: 1px solid black;
            min-height: 120px;
            padding: 15px;
        }

        div.card h2{
            margin-top: 0px;
        }
    </style>
</head>
<body>
    <h1>Grid responsivo com repeat() e minmax()</h1>

    <div class="container">
        <div class="card">
            <h2>Card 1</h2>
            <p>A largura minima e 180px.</p>
        </div>
        <div class="card">
            <h2>Card 2</h2>
            <p>O 1fr divide o espaco disponivel.</p>
        </div>
        <div class="card">
            <h2>Card 3</h2>
            <p>O auto-fit cria quantas colunas couberem.</p>
        </div>
        <div class="card">
            <h2>Card 4</h2>
            <p>Diminua a janela do navegador para testar.</p>
        </div>
    </div>
</body>
</html>
